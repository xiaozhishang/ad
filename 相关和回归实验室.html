<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相关与回归分析交互实验室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        .header .subtitle {
            font-size: 0.95em;
            opacity: 0.9;
        }
        .content {
            display: flex;
            min-height: 550px;
            flex-wrap: wrap;
        }
        .chart-section {
            flex: 3;
            padding: 20px;
            background: #f8f9fa;
            position: relative;
            min-width: 300px;
        }
        .info-section {
            flex: 1;
            padding: 20px;
            background: white;
            border-left: 3px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 280px;
        }
        #main {
            width: 100%;
            height: 480px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            cursor: crosshair;
        }
        .stats-panel {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stats-value {
            font-size: 1.8em;
            font-weight: bold;
            margin: 8px 0;
            display: flex;
            justify-content: space-around;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 12px 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #00b894, #00a085);
            color: white;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            color: white;
        }
        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            color: white;
        }
        .drag-status {
            text-align: center;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .drag-active {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .drag-inactive {
            background: #f8f9fa;
            color: #666;
        }
        .quick-guide {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
        }
        .guide-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
        }
        .guide-icon {
            font-size: 16px;
            margin-right: 8px;
            width: 20px;
            text-align: center;
        }
        .correlation-guide {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .correlation-scale {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            position: relative;
            height: 30px;
            align-items: center;
        }
        .scale-bar {
            position: absolute;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #3498db, #f39c12, #e74c3c);
            border-radius: 4px;
        }
        .scale-label {
            position: relative;
            z-index: 2;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            flex: 1;
        }
        .scale-marker {
            position: absolute;
            top: -5px;
            width: 2px;
            height: 18px;
            background: #2c3e50;
            z-index: 3;
        }
        .r-squared-info {
            background: #e8f5e8;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #27ae60;
            margin-top: 10px;
        }
        .r-squared-value {
            font-size: 14px;
            font-weight: bold;
            color: #27ae60;
            text-align: center;
            margin: 5px 0;
        }
        .footer {
            text-align: center;
            padding: 10px;
            background: #2c3e50;
            color: white;
            font-size: 0.8em;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
            display: none;
        }
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            .info-section {
                border-left: none;
                border-top: 3px solid #e9ecef;
            }
            #main {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 相关与回归分析交互实验室</h1>
            <div class="subtitle">拖动数据点，实时观察统计指标变化</div>
        </div>
        
        <div class="error-message" id="errorMessage">
            图表加载失败，请刷新页面重试
        </div>
        
        <div class="content">
            <div class="chart-section">
                <div id="main">
                    <canvas id="chartCanvas"></canvas>
                </div>
                <div class="drag-status drag-inactive" id="dragStatus">
                    💡 点击"开启拖动"后，点击并拖动数据点
                </div>
            </div>
            
            <div class="info-section">
                <div class="stats-panel">
                    <div style="font-size: 14px; margin-bottom: 5px;">实时统计指标</div>
                    <div class="stats-value" id="stats">
                        <div>r: --</div>
                        <div>R²: --</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn-primary" onclick="addPoint()">添加点</button>
                    <button class="btn-secondary" onclick="addCluster()">数据簇</button>
                    <button class="btn-warning" onclick="toggleDrag()" id="dragBtn">开启拖动</button>
                    <button class="btn-secondary" onclick="resetData()">重置</button>
                </div>

                <div class="quick-guide">
                    <div style="font-weight: bold; margin-bottom: 8px; color: #856404;">🎯 操作指南</div>
                    <div class="guide-item">
                        <span class="guide-icon">👆</span>
                        <span>开启拖动 → 移动数据点</span>
                    </div>
                    <div class="guide-item">
                        <span class="guide-icon">🖱️</span>
                        <span>点击空白处 → 添加新点</span>
                    </div>
                    <div class="guide-item">
                        <span class="guide-icon">📈</span>
                        <span>观察 r 和 R² 实时变化</span>
                    </div>
                </div>
                
                <div class="correlation-guide">
                    <div style="font-weight: bold; margin-bottom: 10px;">📊 相关系数解读</div>
                    
                    <div class="correlation-scale">
                        <div class="scale-bar"></div>
                        <div class="scale-marker" style="left: 0%;"></div>
                        <div class="scale-marker" style="left: 30%;"></div>
                        <div class="scale-marker" style="left: 70%;"></div>
                        <div class="scale-marker" style="left: 100%;"></div>
                        
                        <div class="scale-label">-1.0</div>
                        <div class="scale-label">-0.3</div>
                        <div class="scale-label">0</div>
                        <div class="scale-label">0.3</div>
                        <div class="scale-label">1.0</div>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 5px;">
                        <div style="color: #3498db;">强负相关</div>
                        <div style="color: #f39c12;">弱相关</div>
                        <div style="color: #e74c3c;">强正相关</div>
                    </div>

                    <div class="r-squared-info">
                        <div style="font-size: 13px; font-weight: bold; color: #27ae60;">R² 决定系数</div>
                        <div class="r-squared-value">模型解释数据变异的比例</div>
                        <div style="font-size: 11px; text-align: center; color: #555;">
                            值越大，模型拟合越好
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            基于 Canvas 绘制 | 统计教学工具
        </div>
    </div>

    <script>
        // 全局变量
        let chart = null;
        let points = [
            {x: 12, y: 18, id: 1}, {x: 14, y: 22, id: 2}, {x: 16, y: 26, id: 3},
            {x: 18, y: 29, id: 4}, {x: 20, y: 33, id: 5}, {x: 22, y: 36, id: 6},
            {x: 24, y: 39, id: 7}, {x: 26, y: 42, id: 8}, {x: 28, y: 45, id: 9},
            {x: 30, y: 48, id: 10}
        ];
        
        let isDraggingEnabled = false;
        let isDragging = false;
        let draggedPoint = null;
        let dragOffset = { x: 0, y: 0 };
        let nextId = 11;

        // 图表配置
        const config = {
            margin: { top: 50, right: 50, bottom: 50, left: 50 },
            pointRadius: 8
        };

        // 初始化图表
        function initChart() {
            const canvas = document.getElementById('chartCanvas');
            const container = document.getElementById('main');
            
            if (!canvas || !container) {
                setTimeout(initChart, 100);
                return;
            }

            // 设置canvas尺寸
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // 绑定事件
            bindEvents(canvas);
            
            // 初始绘制
            drawChart();
            
            console.log('图表初始化成功');
        }

        // 绑定事件
        function bindEvents(canvas) {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('click', handleClick);
            
            // 窗口大小变化时重绘
            window.addEventListener('resize', function() {
                setTimeout(function() {
                    const container = document.getElementById('main');
                    const canvas = document.getElementById('chartCanvas');
                    if (container && canvas) {
                        const rect = container.getBoundingClientRect();
                        canvas.width = rect.width;
                        canvas.height = rect.height;
                        drawChart();
                    }
                }, 100);
            });
        }

        // 鼠标按下事件
        function handleMouseDown(e) {
            if (!isDraggingEnabled) return;
            
            const rect = e.target.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 检查是否点击了数据点
            for (let i = points.length - 1; i >= 0; i--) {
                const point = points[i];
                const pointX = xToPixel(point.x);
                const pointY = yToPixel(point.y);
                
                const distance = Math.sqrt(
                    Math.pow(mouseX - pointX, 2) + 
                    Math.pow(mouseY - pointY, 2)
                );
                
                if (distance < config.pointRadius * 2) {
                    isDragging = true;
                    draggedPoint = point;
                    dragOffset.x = mouseX - pointX;
                    dragOffset.y = mouseY - pointY;
                    
                    // 更新状态显示
                    document.getElementById('dragStatus').textContent = '🎯 正在拖动点，移动鼠标调整位置';
                    document.getElementById('dragStatus').className = 'drag-status drag-active';
                    
                    drawChart();
                    break;
                }
            }
        }

        // 鼠标移动事件
        function handleMouseMove(e) {
            if (!isDragging || !draggedPoint) return;
            
            const rect = e.target.getBoundingClientRect();
            const mouseX = e.clientX - rect.left - dragOffset.x;
            const mouseY = e.clientY - rect.top - dragOffset.y;
            
            // 转换回数据坐标
            draggedPoint.x = pixelToX(mouseX);
            draggedPoint.y = pixelToY(mouseY);
            
            // 限制坐标范围
            draggedPoint.x = Math.max(0, Math.min(100, draggedPoint.x));
            draggedPoint.y = Math.max(0, Math.min(100, draggedPoint.y));
            
            drawChart();
            updateStats();
        }

        // 鼠标释放事件
        function handleMouseUp() {
            if (isDragging) {
                isDragging = false;
                draggedPoint = null;
                
                if (isDraggingEnabled) {
                    document.getElementById('dragStatus').textContent = '👆 拖动模式已开启 - 点击拖动数据点';
                    document.getElementById('dragStatus').className = 'drag-status drag-active';
                }
            }
        }

        // 点击事件（添加新点）
        function handleClick(e) {
            // 只有在拖动模式开启且没有拖动点时才能添加新点
            if (isDraggingEnabled && !isDragging) {
                const rect = e.target.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                // 转换为数据坐标
                const dataX = pixelToX(mouseX);
                const dataY = pixelToY(mouseY);
                
                // 限制坐标范围
                const validX = Math.max(0, Math.min(100, dataX));
                const validY = Math.max(0, Math.min(100, dataY));
                
                // 添加新点
                points.push({
                    x: Math.round(validX * 10) / 10,
                    y: Math.round(validY * 10) / 10,
                    id: nextId++
                });
                
                drawChart();
                updateStats();
            }
        }

        // 坐标转换函数
        function xToPixel(x) {
            const canvas = document.getElementById('chartCanvas');
            const xValues = points.map(p => p.x);
            const xMin = xValues.length ? Math.min(...xValues) - 5 : 0;
            const xMax = xValues.length ? Math.max(...xValues) + 5 : 20;
            
            return config.margin.left + (x - xMin) / (xMax - xMin) * (canvas.width - config.margin.left - config.margin.right);
        }

        function yToPixel(y) {
            const canvas = document.getElementById('chartCanvas');
            const yValues = points.map(p => p.y);
            const yMin = yValues.length ? Math.min(...yValues) - 5 : 0;
            const yMax = yValues.length ? Math.max(...yValues) + 5 : 20;
            
            return canvas.height - config.margin.bottom - (y - yMin) / (yMax - yMin) * (canvas.height - config.margin.top - config.margin.bottom);
        }

        function pixelToX(px) {
            const canvas = document.getElementById('chartCanvas');
            const xValues = points.map(p => p.x);
            const xMin = xValues.length ? Math.min(...xValues) - 5 : 0;
            const xMax = xValues.length ? Math.max(...xValues) + 5 : 20;
            
            return xMin + (px - config.margin.left) / (canvas.width - config.margin.left - config.margin.right) * (xMax - xMin);
        }

        function pixelToY(py) {
            const canvas = document.getElementById('chartCanvas');
            const yValues = points.map(p => p.y);
            const yMin = yValues.length ? Math.min(...yValues) - 5 : 0;
            const yMax = yValues.length ? Math.max(...yValues) + 5 : 20;
            
            return yMin + (canvas.height - config.margin.bottom - py) / (canvas.height - config.margin.top - config.margin.bottom) * (yMax - yMin);
        }

        // 绘制图表
        function drawChart() {
            const canvas = document.getElementById('chartCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // 清空画布
            ctx.clearRect(0, 0, width, height);
            
            // 绘制背景
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);
            
            // 绘制标题
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('散点图与回归分析', width / 2, 25);
            
            // 绘制坐标轴
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 2;
            
            // X轴
            ctx.beginPath();
            ctx.moveTo(config.margin.left, height - config.margin.bottom);
            ctx.lineTo(width - config.margin.right, height - config.margin.bottom);
            ctx.stroke();
            
            // Y轴
            ctx.beginPath();
            ctx.moveTo(config.margin.left, config.margin.top);
            ctx.lineTo(config.margin.left, height - config.margin.bottom);
            ctx.stroke();
            
            // 绘制坐标轴标签
            ctx.fillStyle = '#34495e';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('X 变量', width / 2, height - 10);
            
            ctx.save();
            ctx.translate(15, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Y 变量', 0, 0);
            ctx.restore();
            
            // 绘制网格线
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 1;
            
            // 垂直网格线
            for (let i = 1; i < 5; i++) {
                const x = config.margin.left + (width - config.margin.left - config.margin.right) * i / 5;
                ctx.beginPath();
                ctx.moveTo(x, config.margin.top);
                ctx.lineTo(x, height - config.margin.bottom);
                ctx.stroke();
            }
            
            // 水平网格线
            for (let i = 1; i < 5; i++) {
                const y = config.margin.top + (height - config.margin.top - config.margin.bottom) * i / 5;
                ctx.beginPath();
                ctx.moveTo(config.margin.left, y);
                ctx.lineTo(width - config.margin.right, y);
                ctx.stroke();
            }
            
            // 绘制回归线
            if (points.length >= 2) {
                const { slope, intercept } = calculateRegression();
                
                const xValues = points.map(p => p.x);
                const xMin = Math.min(...xValues) - 5;
                const xMax = Math.max(...xValues) + 5;
                
                const y1 = intercept + slope * xMin;
                const y2 = intercept + slope * xMax;
                
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(xToPixel(xMin), yToPixel(y1));
                ctx.lineTo(xToPixel(xMax), yToPixel(y2));
                ctx.stroke();
            }
            
            // 绘制数据点
            points.forEach(point => {
                const x = xToPixel(point.x);
                const y = yToPixel(point.y);
                
                // 点阴影
                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 5;
                
                // 点外圈
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(x, y, config.pointRadius + 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 点内圈 - 被拖动的点显示为红色
                ctx.fillStyle = (point === draggedPoint) ? '#e74c3c' : '#3498db';
                ctx.beginPath();
                ctx.arc(x, y, config.pointRadius, 0, Math.PI * 2);
                ctx.fill();
                
                // 重置阴影
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                
                // 显示坐标值
                ctx.fillStyle = '#666';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`(${point.x.toFixed(1)}, ${point.y.toFixed(1)})`, x, y - 15);
            });
        }

        // 计算回归线
        function calculateRegression() {
            if (points.length < 2) return { slope: 0, intercept: 0, r: 0, r2: 0 };

            const n = points.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;

            points.forEach(point => {
                const x = point.x;
                const y = point.y;
                sumX += x;
                sumY += y;
                sumXY += x * y;
                sumX2 += x * x;
                sumY2 += y * y;
            });

            const meanX = sumX / n;
            const meanY = sumY / n;
            const numerator = sumXY - (sumX * sumY) / n;
            const denominator = sumX2 - (sumX * sumX) / n;

            const slope = denominator !== 0 ? numerator / denominator : 0;
            const intercept = meanY - slope * meanX;

            const r = denominator !== 0 && (sumY2 - (sumY * sumY) / n) !== 0 
                ? numerator / Math.sqrt(denominator * (sumY2 - (sumY * sumY) / n))
                : 0;
            const r2 = r * r;

            return { slope, intercept, r, r2 };
        }

        // 更新统计信息
        function updateStats() {
            const { r, r2 } = calculateRegression();
            document.getElementById('stats').innerHTML = 
                `<div>r: ${r.toFixed(3)}</div><div>R²: ${r2.toFixed(3)}</div>`;
        }

        // 切换拖动模式
        function toggleDrag() {
            isDraggingEnabled = !isDraggingEnabled;
            const btn = document.getElementById('dragBtn');
            const statusEl = document.getElementById('dragStatus');
            
            if (isDraggingEnabled) {
                btn.textContent = '关闭拖动';
                btn.style.background = 'linear-gradient(135deg, #e74c3c, #c0392b)';
                statusEl.textContent = '👆 拖动模式已开启 - 点击拖动数据点';
                statusEl.className = 'drag-status drag-active';
            } else {
                btn.textContent = '开启拖动';
                btn.style.background = 'linear-gradient(135deg, #fdcb6e, #f39c12)';
                statusEl.textContent = '💡 点击"开启拖动"后拖动数据点';
                statusEl.className = 'drag-status drag-inactive';
                isDragging = false;
                draggedPoint = null;
            }
            
            drawChart();
        }

        // 添加点
        function addPoint() {
            const lastX = points.length > 0 ? points[points.length - 1].x : 15;
            const x = lastX + 2 + (Math.random() - 0.5) * 4;
            const y = x * 1.5 + (Math.random() - 0.5) * 10;
            
            points.push({
                x: Math.round(x * 10) / 10,
                y: Math.round(y * 10) / 10,
                id: nextId++
            });
            
            drawChart();
            updateStats();
        }

        // 添加数据簇
        function addCluster() {
            const centerX = 15 + Math.random() * 15;
            const centerY = 25 + Math.random() * 15;
            
            for (let i = 0; i < 5; i++) {
                points.push({
                    x: Math.round((centerX + (Math.random() - 0.5) * 6) * 10) / 10,
                    y: Math.round((centerY + (Math.random() - 0.5) * 6) * 10) / 10,
                    id: nextId++
                });
            }
            
            drawChart();
            updateStats();
        }

        // 重置数据
        function resetData() {
            points = [
                {x: 12, y: 18, id: 1}, {x: 14, y: 22, id: 2}, {x: 16, y: 26, id: 3},

        }
    </script>
